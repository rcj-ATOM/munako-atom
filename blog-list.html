<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #02677b;
    }
    body.dark-theme {
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-color: #38bdf8;
    }
    body {
      margin: 0; padding: 10px; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .blog-grid { display: flex; flex-direction: column; gap: 20px; }
    .blog-card-link { text-decoration: none; color: inherit; display: block; }
    .blog-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex; gap: 20px; align-items: center;
      transition: all 0.3s ease;
    }
    .blog-card:hover { border-color: var(--accent-color); transform: translateY(-2px); }
    .blog-thumb {
      width: 180px; height: 120px; object-fit: cover;
      border-radius: 8px; flex-shrink: 0; background: #eee;
    }
    .blog-info { flex-grow: 1; }
    .blog-date { font-size: 0.8rem; color: var(--text-sub); font-weight: 700; margin-bottom: 5px; }
    .blog-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; line-height: 1.4; }
    .blog-excerpt { font-size: 0.85rem; color: var(--text-sub); line-height: 1.5; }

    @media (max-width: 600px) {
      .blog-card { flex-direction: column; align-items: flex-start; }
      .blog-thumb { width: 100%; height: 150px; }
    }
  </style>
</head>
<body>

  <div class="blog-grid" id="JS_BLOG_GRID"></div>

  <script>
    // --------------------------------------------------
    // 【編集エリア】記事が増えたらここに追加
    // --------------------------------------------------
    const blogData = [
      {
        id: 1,
        title: "チームサイトV1.0が完成しました！",
        date: "2026.08.08",
        excerpt: "Webサイトをつくってみた話。",
        image: "blog/blog-images/HomePageimage.png",
        url: "blog/blog-01.html"
      },
      
      {
        id: 2,
        title: "北九州オープン2026結果報告",
        date: "2026.08.11",
        excerpt: "北九州オープンでいい結構頑張った話",
        image: "blog/blog-images/Kita2026big.jpg",
        url: "blog/blog-02.html"
      },
    ];

    function render() {
      const grid = document.getElementById('JS_BLOG_GRID');
      grid.innerHTML = '';
      // ID降順（最新順）に並び替え
      const sorted = [...blogData].sort((a, b) => b.id - a.id);
      sorted.forEach(item => {
        const html = `
          <a href="${item.url}" class="blog-card-link" target="_parent">
            <div class="blog-card">
              <img src="${item.image}" alt="" class="blog-thumb">
              <div class="blog-info">
                <div class="blog-date">${item.date}</div>
                <div class="blog-title">${item.title}</div>
                <div class="blog-excerpt">${item.excerpt}</div>
              </div>
            </div>
          </a>
        `;
        grid.insertAdjacentHTML('beforeend', html);
      });
    }

    // 親からのテーマ切替通知を受信
    window.addEventListener('message', (e) => {
      if (e.data && typeof e.data.darkTheme !== 'undefined') {
        document.body.classList.toggle('dark-theme', e.data.darkTheme);
      }
    });

    render();
  </script>
</body>
</html>
