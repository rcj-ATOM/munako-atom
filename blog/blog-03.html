<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブログ記事タイトル - ATOM</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #02677b;
    }

    body.dark-theme {
      --bg-main: #0d1117;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-color: #38bdf8;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.8;
      transition: background-color 0.3s, color 0.3s;
    }

    .blog-article {
      max-width: 760px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px;
      box-sizing: border-box;
    }

    .back-link {
      display: inline-block;
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .article-date {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .article-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 8px 0 32px 0;
      line-height: 1.3;
    }

    /* 記事本文内のパーツ自由配置スタイル */
    .blog-content p {
      margin-bottom: 24px;
      color: var(--text-main);
    }

    .blog-content h3 {
      font-size: 1.3rem;
      margin: 40px 0 16px 0;
      color: var(--accent-color);
      border-left: 4px solid var(--accent-color);
      padding-left: 12px;
    }

    /* 好きな場所に入れられる画像のスタイル */
    .blog-image {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 24px 0;
      display: block;
      border: 1px solid var(--border-color);
    }

    .image-caption {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-align: center;
      margin-top: -16px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <article class="blog-article">
    <a href="../index.html#blog" class="back-link">← TOPへ戻る</a>    <div class="article-date">2026.08.07</div>
    <h1 class="article-title">ロボットの新しいプロトタイプを公開しました</h1>

    <div class="blog-content">
      <p>ここに自由に文章を書きます。最初のアプローチとして新しいフレームワークを導入しました。</p>

      <h3>開発の進捗について</h3>
      <p>以下の画像は今回テストしたパーツの組み上げ写真です。</p>

      <img src="images/robot01image.jpg" alt="ロボット画像" class="blog-image">
      <div class="image-caption">写真01：新型フレームのテスト風景</div>

      <p>このように画像の下に続けて文章を書くことができます。何枚でも自由な場所に画像を配置可能です。</p>

      </div>
  </article>

</body>
</html>
